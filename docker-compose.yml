services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: edubench
      POSTGRES_USER: edubench
      POSTGRES_PASSWORD: edubench
    ports:
      - "54329:5432"
    volumes:
      - edubench_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edubench -d edubench"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://edubench:edubench@db:5432/edubench
      STORAGE_ROOT: /data/storage
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed && npm start"]
    ports:
      - "${WEB_PORT:-63000}:3000"
    volumes:
      - edubench_storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/dashboard').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 30
  worker:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://edubench:edubench@db:5432/edubench
      STORAGE_ROOT: /data/storage
    command: ["npm", "run", "worker"]
    restart: unless-stopped
    volumes:
      - edubench_storage:/data/storage
    depends_on:
      web:
        condition: service_healthy

volumes:
  edubench_db:
  edubench_storage:

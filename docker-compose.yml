services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: edubench
      POSTGRES_USER: edubench
      POSTGRES_PASSWORD: edubench
    ports:
      - "${DB_PORT:-54329}:5432"
    volumes:
      - edubench_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edubench -d edubench"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://edubench:edubench@db:5432/edubench
      STORAGE_ROOT: /data/storage
    # Migrations and seeds are idempotent. The background worker runs inside
    # the web process (src/instrumentation.ts) so it can use the API keys the
    # browser sends with each request; keys are never stored.
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed && npm run db:seed-demo && npm start"]
    ports:
      - "${WEB_PORT:-63000}:3000"
    volumes:
      - edubench_storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 60s

volumes:
  edubench_db:
  edubench_storage:
